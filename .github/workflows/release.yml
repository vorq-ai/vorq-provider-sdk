name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A tag is published once. Two runs of the same tag would race on the index, so
# the later one waits rather than being cancelled mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade 'pip>=25.1' build
      - run: pip install -e . --group dev
      - run: pytest
      - run: python -m build
      # The tag must equal `v` + the version the build stamped, so a tag cannot
      # publish a version nobody bumped. The tag reaches the shell through the
      # environment, never through `${{ }}` interpolation into the script.
      - name: check version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$REF_NAME" = "v$version" || { echo "tag $REF_NAME != v$version"; exit 1; }
          test -f "dist/vorq_provider-$version-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Trusted publishing: PyPI accepts this job's OIDC identity (repo, workflow,
  # environment), so no API token exists anywhere.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
